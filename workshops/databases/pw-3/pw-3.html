<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP 3 — Compte Rendu</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: #080a08;
        color: #d7e0d7;
        font:
          16px/1.6 Arial,
          Helvetica,
          sans-serif;
      }

      main {
        width: min(900px, calc(100% - 32px));
        margin: 40px auto;
      }

      header {
        margin-bottom: 35px;
        padding: 35px;
        background: #101410;
        border: 1px solid #263026;
        border-left: 4px solid #4caf50;
        box-shadow: 0 8px 30px #000;
      }

      header h1 {
        margin: 0;
        color: #7cff8b;
        font:
          bold clamp(28px, 5vw, 42px)/1.2 "Courier New",
          monospace;
        letter-spacing: 1px;
      }

      header p {
        margin: 10px 0 0;
        color: #899589;
        font-size: 16px;
      }

      .answer {
        margin: 25px 0;
        padding: 22px;
        background: #0e120e;
        border: 1px solid #222b22;
        border-left: 3px solid #4caf50;
        border-radius: 5px;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.45);
      }

      .answer h2 {
        margin: 0 0 18px;
        color: #9aff9f;
        font:
          bold 20px/1.3 "Courier New",
          monospace;
      }

      figure {
        margin: 15px 0 5px;
        padding: 10px;
        background: #050705;
        border: 1px solid #273027;
        border-radius: 5px;
        overflow: hidden;
      }

      figure img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
      }

      .label {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 9px;
        color: #081008;
        background: #69d96f;
        border-radius: 3px;
        font:
          bold 14px "Courier New",
          monospace;
      }

      .page-break {
        height: 1px;
        margin: 50px 0;
        border-top: 1px dashed #293029;
        page-break-before: always;
      }

      footer {
        padding: 30px 0 50px;
        color: #566056;
        font:
          13px "Courier New",
          monospace;
        text-align: center;
      }

      @media (max-width: 600px) {
        main {
          width: calc(100% - 20px);
          margin: 15px auto;
        }

        header,
        .answer {
          padding: 18px;
        }

        body {
          font-size: 15px;
        }
      }

      @media print {
        body {
          color: #000;
          background: #fff;
        }

        header,
        .answer {
          background: #fff;
          box-shadow: none;
          border-color: #ccc;
        }

        header h1,
        .answer h2 {
          color: #000;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>TP 3 : Compte Rendu</h1>
        <p>Travail pratique — réponses et captures d'écran</p>
      </header>

      <section class="answer">
        <span class="label">3</span>
        <figure>
          <img src="images/image5.gif" alt="Réponse à la question 3" />
        </figure>
      </section>

        <span class="label">4 — a</span>

      </section>

      <section class="answer">

        </figure>
      </section>

      <section class="answer">
        <span class="label">4 — c</span>
        <figure>
          <img src="images/image9.gif" alt="Réponse 4c" />
        </figure>
      </section>

      <section class="answer">
        <span class="label">4 — d</span>
        <figure>
          <img src="images/image4.gif" alt="Réponse 4d" />
        </figure>
      </section>

      <section class="answer">
        <span class="label">4 — e</span>

        <figure>
          <img src="images/image2.png" alt="Réponse 4e" />
        </figure>

        <figure>
          <img src="images/image1.png" alt="Réponse 4e" />
        </figure>
      </section>

      <section class="answer">
        <span class="label">4 — f</span>
        <figure>
          <img src="images/image7.png" alt="Réponse 4f" />
        </figure>
      </section>

      <div class="page-break"></div>

      <section class="answer">
        <span class="label">4 — g</span>
        <figure>
          <img src="images/image10.png" alt="Réponse 4g" />
        </figure>
      </section>

      <section class="answer">
        <span class="label">4 — h</span>

        <figure>
          <img src="images/image6.gif" alt="Réponse 4h" />
        </figure>

        <figure>
          <img src="images/image3.gif" alt="Réponse 4h" />
        </figure>
      </section>

      <footer>TP 3 · Compte Rendu</footer>
    </main>
  </body>
</html>
